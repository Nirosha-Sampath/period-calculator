<!DOCTYPE html>
<html lang="si" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පීරියඩ් කාල ගණකය - Period Duration Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        amber: {
                            300: '#fde047',
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans Sinhala', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for Sinhala and Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Sinhala:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans Sinhala', 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-stat-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .glow-indigo {
            box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.25);
        }

        .glow-amber {
            box-shadow: 0 0 35px -5px rgba(245, 158, 11, 0.2);
        }

        /* Custom Number input spin button styling */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="text-slate-200 antialiased selection:bg-indigo-500/30 selection:text-indigo-300 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-slate-950/70 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 via-purple-600 to-amber-500 rounded-xl flex items-center justify-center shadow-lg glow-indigo">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-slate-100 to-amber-300" id="appTitle">
                        පීරියඩ් කාල ගණකය
                    </h1>
                    <p class="text-xs text-slate-400 font-medium" id="appSubtitle">
                        සරල කාල ගණනය කිරීමේ යෙදුම
                    </p>
                </div>
            </div>
            
            <!-- Language Switcher -->
            <button id="langToggleBtn" onclick="toggleLanguage()" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-xl glass-card hover:bg-slate-800/80 active:scale-95 transition-all text-xs font-semibold text-amber-400 border border-amber-500/30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1 4h6m-1 0l-4 10M9 13h6m-7 5l2-4.5M16 11l-3 7"></path>
                </svg>
                <span id="langLabel">English</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full flex flex-col justify-center">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-stretch">
            
            <!-- Inputs Card -->
            <div class="md:col-span-6 flex flex-col justify-between glass-card rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-600/10 rounded-full blur-2xl pointer-events-none"></div>

                <div>
                    <h2 class="text-base font-semibold text-slate-100 mb-6 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                        </svg>
                        <span id="labelInputsHeader">ආදාන සැකසුම්</span>
                    </h2>

                    <!-- Number of Periods Input -->
                    <div class="mb-6">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2" id="labelNumPeriods">
                            පීරියඩ් ගණන
                        </label>
                        <div class="flex items-center space-x-2">
                            <button type="button" onclick="adjustPeriods(-1)" aria-label="Decrease periods" class="w-11 h-11 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-xl border border-slate-700 transition-all flex items-center justify-center">
                                -
                            </button>
                            <input type="number" id="periodInput" value="1" min="1" max="500" oninput="calculate()" class="flex-1 h-11 text-center bg-slate-900/90 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-indigo-300 text-xl font-bold rounded-xl outline-none transition-all">
                            <button type="button" onclick="adjustPeriods(1)" aria-label="Increase periods" class="w-11 h-11 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold text-xl border border-slate-700 transition-all flex items-center justify-center">
                                +
                            </button>
                        </div>
                    </div>

                    <!-- Period Length Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2" id="labelPeriodDuration">
                            එක් පීරියඩයක කාලය (මිනිත්තු)
                        </label>
                        <div class="relative">
                            <input type="number" id="lengthInput" value="40" min="1" max="1440" oninput="calculate()" class="w-full h-11 px-4 bg-slate-900/90 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-200 text-base font-semibold rounded-xl outline-none transition-all">
                            <span class="absolute right-3.5 top-3 text-xs text-slate-400 pointer-events-none font-medium" id="labelMinsPerPeriod">
                                මිනිත්තු
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Display Section -->
            <div class="md:col-span-6 flex flex-col space-y-4">
                
                <!-- Hours & Minutes Result Card -->
                <div class="glass-stat-card rounded-2xl p-6 border border-indigo-500/30 flex-1 flex flex-col justify-center relative overflow-hidden glow-indigo">
                    <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2" id="labelTotalAvailableTime">
                        මුළු කාලය
                    </div>
                    <div id="formattedTime" class="text-3xl sm:text-4xl font-extrabold text-slate-100 mb-1">
                        මිනිත්තු 40
                    </div>
                    <div id="summaryBadge" class="text-xs text-indigo-300/80 font-medium mt-1">
                        පීරියඩ් 1 × මිනිත්තු 40
                    </div>
                </div>

                <!-- Total Minutes & Decimal Hours Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Total Minutes Card -->
                    <div class="glass-stat-card rounded-2xl p-5 border border-amber-500/30 flex flex-col justify-center glow-amber">
                        <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1" id="labelTotalMinutes">
                            සමස්ත මිනිත්තු ගණන
                        </div>
                        <div class="flex items-baseline" id="totalMinutesContainer">
                            <span id="prefixMinsUnit" class="text-xl sm:text-2xl font-bold text-amber-400 mr-2">මිනිත්තු</span>
                            <span id="totalMinutes" class="text-2xl sm:text-3xl font-extrabold text-amber-300">40</span>
                            <span id="suffixMinsUnit" class="text-xs font-semibold text-amber-400/80 ml-1.5 hidden"></span>
                        </div>
                    </div>

                    <!-- Decimal Hours Card -->
                    <div class="glass-stat-card rounded-2xl p-5 border border-purple-500/30 flex flex-col justify-center">
                        <div class="text-xs font-bold text-purple-400 uppercase tracking-wider mb-1" id="labelDecimalHours">
                            පැය ගණන (දශම ලෙස)
                        </div>
                        <div class="flex items-baseline" id="decimalHoursContainer">
                            <span id="prefixHrsUnit" class="text-xl sm:text-2xl font-bold text-purple-400 mr-2">පැය</span>
                            <span id="decimalHours" class="text-2xl sm:text-3xl font-extrabold text-purple-300">0.67</span>
                            <span id="suffixHrsUnit" class="text-xs font-semibold text-purple-400/80 ml-1.5 hidden"></span>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950/40 py-4 mt-auto">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-500">
            <span id="footerText">පීරියඩ් කාල ගණනය කිරීමේ යෙදුම</span>
        </div>
    </footer>

    <script>
        // Default language set to Sinhala
        let currentLang = 'si';

        const translations = {
            si: {
                title: 'පීරියඩ් කාල ගණකය',
                subtitle: 'සරල කාල ගණනය කිරීමේ යෙදුම',
                toggleText: 'English',
                inputsHeader: 'ආදාන සැකසුම්',
                numPeriods: 'පීරියඩ් ගණන',
                periodDuration: 'එක් පීරියඩයක කාලය (මිනිත්තු)',
                minsPerPeriod: 'මිනිත්තු',
                totalAvailableTime: 'මුළු කාලය',
                totalMinutes: 'සමස්ත මිනිත්තු ගණන',
                decimalHours: 'පැය ගණන (දශම ලෙස)',
                footerText: 'පීරියඩ් කාල ගණනය කිරීමේ යෙදුම',
                hrsUnit: 'පැය',
                minsUnit: 'මිනිත්තු',
                periodUnit: 'පීරියඩ්'
            },
            en: {
                title: 'Period Duration Calculator',
                subtitle: 'Simple Duration Calculator',
                toggleText: 'සිංහල',
                inputsHeader: 'Calculator Inputs',
                numPeriods: 'Number of Periods',
                periodDuration: 'Duration per Period (Minutes)',
                minsPerPeriod: 'mins / period',
                totalAvailableTime: 'Total Available Time',
                totalMinutes: 'Total Minutes',
                decimalHours: 'Equivalent Decimal Hours',
                footerText: 'Period Duration Calculator',
                hrsUnitSingular: 'hour',
                hrsUnitPlural: 'hours',
                minsUnitSingular: 'minute',
                minsUnitPlural: 'minutes',
                periodUnitSingular: 'Period',
                periodUnitPlural: 'Periods'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'si' ? 'en' : 'si';
            document.documentElement.lang = currentLang;
            updateTexts();
            calculate();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('appTitle').textContent = t.title;
            document.getElementById('appSubtitle').textContent = t.subtitle;
            document.getElementById('langLabel').textContent = t.toggleText;
            document.getElementById('labelInputsHeader').textContent = t.inputsHeader;
            document.getElementById('labelNumPeriods').textContent = t.numPeriods;
            document.getElementById('labelPeriodDuration').textContent = t.periodDuration;
            document.getElementById('labelMinsPerPeriod').textContent = t.minsPerPeriod;
            document.getElementById('labelTotalAvailableTime').textContent = t.totalAvailableTime;
            document.getElementById('labelTotalMinutes').textContent = t.totalMinutes;
            document.getElementById('labelDecimalHours').textContent = t.decimalHours;
            document.getElementById('footerText').textContent = t.footerText;

            // Handle unit position for single metric displays
            const prefixMins = document.getElementById('prefixMinsUnit');
            const suffixMins = document.getElementById('suffixMinsUnit');
            const prefixHrs = document.getElementById('prefixHrsUnit');
            const suffixHrs = document.getElementById('suffixHrsUnit');

            if (currentLang === 'si') {
                prefixMins.textContent = t.minsUnit;
                prefixMins.classList.remove('hidden');
                suffixMins.classList.add('hidden');

                prefixHrs.textContent = t.hrsUnit;
                prefixHrs.classList.remove('hidden');
                suffixHrs.classList.add('hidden');
            } else {
                prefixMins.classList.add('hidden');
                suffixMins.classList.remove('hidden');

                prefixHrs.classList.add('hidden');
                suffixHrs.classList.remove('hidden');
            }
        }

        function adjustPeriods(delta) {
            const input = document.getElementById('periodInput');
            let val = parseInt(input.value) || 0;
            val = Math.max(1, Math.min(500, val + delta));
            input.value = val;
            calculate();
        }

        function calculate() {
            const periods = parseInt(document.getElementById('periodInput').value) || 0;
            const length = parseInt(document.getElementById('lengthInput').value) || 0;

            const t = translations[currentLang];

            // Calculations
            const totalMins = periods * length;
            const hours = Math.floor(totalMins / 60);
            const remainingMins = totalMins % 60;
            const decimalHrs = (totalMins / 60).toFixed(2);

            // Display Raw Numbers
            document.getElementById('totalMinutes').textContent = totalMins;
            document.getElementById('decimalHours').textContent = decimalHrs;

            if (currentLang === 'si') {
                // Sinhala: Units placed BEFORE numerical values
                // Example: පැය 1 මිනිත්තු 40, or මිනිත්තු 40 if hours = 0
                let formattedStr = "";
                if (hours > 0 && remainingMins > 0) {
                    formattedStr = `පැය ${hours} මිනිත්තු ${remainingMins}`;
                } else if (hours > 0 && remainingMins === 0) {
                    formattedStr = `පැය ${hours}`;
                } else {
                    formattedStr = `මිනිත්තු ${remainingMins}`;
                }

                document.getElementById('formattedTime').textContent = formattedStr;
                document.getElementById('summaryBadge').textContent = `පීරියඩ් ${periods} × මිනිත්තු ${length}`;

            } else {
                // English: Numerical values placed BEFORE units with proper pluralization
                let hrsText = hours === 1 ? t.hrsUnitSingular : t.hrsUnitPlural;
                let minsText = remainingMins === 1 ? t.minsUnitSingular : t.minsUnitPlural;
                
                let formattedStr = "";
                if (hours > 0 && remainingMins > 0) {
                    formattedStr = `${hours} ${hrsText} ${remainingMins} ${minsText}`;
                } else if (hours > 0 && remainingMins === 0) {
                    formattedStr = `${hours} ${hrsText}`;
                } else {
                    formattedStr = `${remainingMins} ${minsText}`;
                }

                document.getElementById('formattedTime').textContent = formattedStr;

                // Update English units for single metric cards
                document.getElementById('suffixMinsUnit').textContent = totalMins === 1 ? t.minsUnitSingular : t.minsUnitPlural;
                document.getElementById('suffixHrsUnit').textContent = parseFloat(decimalHrs) === 1 ? t.hrsUnitSingular : t.hrsUnitPlural;

                const periodText = periods === 1 ? t.periodUnitSingular : t.periodUnitPlural;
                document.getElementById('summaryBadge').textContent = `${periods} ${periodText} × ${length} mins`;
            }
        }

        // Initialize Sinhala view and default calculation on page load
        window.onload = function() {
            updateTexts();
            calculate();
        };
    </script>
</body>
</html>
